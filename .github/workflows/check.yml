# Checks pull requests and `main`: the Caddyfile is valid, and every
# __SITE_VERSION__ placeholder sits where the release workflow replaces it.
name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate the Caddyfile
        run: |
          image=$(sed -n 's/^ *image: *\(caddy:.*\)$/\1/p' compose.yaml | head -n 1)
          test -n "$image"
          docker run --rm -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" "$image" \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Check redirects and cache headers
        run: |
          image=$(sed -n 's/^ *image: *\(caddy:.*\)$/\1/p' compose.yaml | head -n 1)
          docker run -d --name website -p 8080:80 \
            -v "$PWD/public:/srv/site:ro" -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" "$image"
          for i in $(seq 1 20); do curl -sf -o /dev/null http://127.0.0.1:8080/ && break; sleep 0.5; done
          expect() { # <path> <status> <header line>
            out=$(curl -sI "http://127.0.0.1:8080$1" | tr -d '\r')
            grep -q "^HTTP/1.1 $2 " <<< "$out" && grep -qiF "$3" <<< "$out" \
              || { echo "::error::$1: expected $2 and '$3'"; echo "$out"; exit 1; }
          }
          expect /products/photo 301 'location: /products/photos'
          expect /products/photo 301 'cache-control: max-age=86400'
          expect / 200 'cache-control: no-cache'
          expect /impressum 200 'cache-control: no-cache'
          expect '/assets/style.css?v=x' 200 'cache-control: public, max-age=31536000, immutable'
          docker rm -f website > /dev/null
      - name: Check the version placeholders
        run: |
          # The release workflow replaces __SITE_VERSION__ in HTML and CSS only.
          if grep -rlF '__SITE_VERSION__' public | grep -vE '\.(html|css)$'; then
            echo "::error::__SITE_VERSION__ outside HTML or CSS is never replaced"; exit 1
          fi
          # Every page loads its stylesheet with the version.
          for page in $(find public -name '*.html'); do
            grep -qF 'style.css?v=__SITE_VERSION__"' "$page" \
              || { echo "::error file=$page::style.css without ?v=__SITE_VERSION__"; exit 1; }
          done
